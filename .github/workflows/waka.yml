name: Waka Readme

on:
  schedule:
    - cron: '0 6 * * 1'     
  workflow_dispatch:      

permissions:
  contents: write          

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          TIME_RANGE: all_time
          LANG_COUNT: 6
          SHOW_TITLE: true
          BLOCKS: ░█
